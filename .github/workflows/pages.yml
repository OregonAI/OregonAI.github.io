name: pages

# Build the organization landing page (build_site.py) and deploy ./site/ to GitHub Pages.
# This repo is named <org>.github.io, so it serves at the org root: https://oregonai.github.io/
on:
  push:
    branches: [main]
  # The page reads each corpus's published corpus-index.json at build time, so it can go
  # stale without anything changing HERE — a sibling corpus shipping its first index should
  # show up without a commit to this repo. Rebuild weekly to pick that up.
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # STDLIB ONLY — urllib does the corpus probing, and there is no requirements file
      # on purpose. There WAS one: a `corpus-toolkit` pin that existed solely for
      # `build_chain.py`, which was deleted in ad5370e when chain.html was retired. The
      # pin outlived its only caller by long enough to freeze nine toolkit versions
      # behind, invisible to `propagate-pin` because this repo is not in its matrix,
      # while every Pages build cloned and built the toolkit from git for nothing.
      # If a build step ever needs a dependency again, add this repo to that matrix in
      # the same change — otherwise the new pin inherits exactly the same fate.
      - name: Build the site
        run: |
          python3 build_site.py
          # Separate builder, same ./site/ output. Runs after build_site.py because
          # it imports STYLE and GATEWAY from it — one definition of the palette and
          # one of the endpoint, shared by both pages.
          python3 build_usage.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
